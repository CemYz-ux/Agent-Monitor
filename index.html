<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenCode · agent monitor</title>
<style>
  /* Palette follows OpenCode's default dark theme. */
  :root {
    --bg:          #0a0a0a;
    --panel:       #141414;
    --element:     #1e1e1e;
    --border:      #2e2e2e;
    --border-hi:   #484848;
    --border-act:  #606060;
    --text:        #eeeeee;
    --muted:       #808080;
    --dim:         #5a5a5a;
    --accent:      #fab283;   /* OpenCode primary (peach) */
    --secondary:   #5c9cf5;
    --running:     #fab283;
    --waiting:     #e5c07b;
    --idle:        #808080;
    --done:        #7fd88f;
    --failed:      #e06c75;
    --interrupted: #9d7cd8;
    --new:         #5c9cf5;
    --dir:         #808080;
    --task:        #56b6c2;
    --mono: "JetBrains Mono", "Cascadia Mono", "Cascadia Code", Consolas, ui-monospace, monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background-color: var(--bg);
    background-image: radial-gradient(circle, #1a1a1a 1px, transparent 1.2px);
    background-size: 24px 24px;
    color: var(--text);
    font-family: var(--mono);
    font-size: 12px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; }
  ::selection { background: var(--accent); color: var(--bg); }

  #stage {
    position: fixed; inset: 0; width: 100%; height: 100%;
    cursor: grab; user-select: none; touch-action: none;
    font-family: var(--mono);
  }
  #stage:active { cursor: grabbing; }

  /* ── boxes: square, bordered, title sitting in the top border ──── */
  .box {
    position: fixed; z-index: 15;
    border: 1px solid var(--border-hi);
    background: var(--panel);
  }
  .box > .box-title {
    position: absolute; top: -9px; left: 10px;
    padding: 0 6px; line-height: 16px;
    background: var(--panel); color: var(--muted);
    font-size: 11px;
  }
  .box > .box-title b { color: var(--text); font-weight: 600; }

  /* ── header ────────────────────────────────────────────────────── */
  #topbar {
    position: fixed; z-index: 20; top: 0; left: 0; right: 0; height: 36px;
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding: 0 14px;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    pointer-events: none;
  }
  .brand { display: flex; align-items: center; gap: 12px; min-width: 0; white-space: nowrap; }
  .wordmark { font-size: 13px; letter-spacing: -.01em; }
  .wordmark .w-open { color: var(--muted); }
  .wordmark .w-code { color: var(--text); font-weight: 700; }
  .brand .crumb { color: var(--dim); }
  .brand .page  { color: var(--text); }
  .live {
    display: inline-flex; align-items: center; gap: 6px;
    color: var(--muted);
  }
  .live-dot { width: 7px; height: 7px; flex: none; background: var(--dim); }
  .live-dot.live    { background: var(--done); animation: blink 1.2s steps(2, start) infinite; }
  .live-dot.stale   { background: var(--waiting); }
  .live-dot.offline { background: var(--failed); }
  @keyframes blink { to { opacity: .25; } }
  .brand .sub { color: var(--dim); overflow: hidden; text-overflow: ellipsis; }

  .chips { display: flex; gap: 16px; white-space: nowrap; }
  .chip { color: var(--muted); }
  .chip b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
  .chip.running b { color: var(--running); }
  .chip.waiting b { color: var(--waiting); }
  .chip.zero b    { color: var(--dim); }

  /* ── status bar ────────────────────────────────────────────────── */
  #statusbar {
    position: fixed; z-index: 20; left: 0; right: 0; bottom: 0; height: 26px;
    display: flex; align-items: stretch; justify-content: space-between;
    background: var(--panel);
    border-top: 1px solid var(--border);
    color: var(--muted); font-size: 11px; white-space: nowrap;
  }
  .sb-left, .sb-right { display: flex; align-items: center; min-width: 0; }
  .sb-mode {
    display: flex; align-items: center; padding: 0 10px; height: 100%;
    background: var(--accent); color: var(--bg); font-weight: 700; letter-spacing: .04em;
  }
  .sb-mode.stale   { background: var(--waiting); }
  .sb-mode.offline { background: var(--failed); }
  .keys { display: flex; gap: 14px; padding: 0 12px; overflow: hidden; }
  .keys kbd { font: inherit; color: var(--text); }
  .sb-right { gap: 14px; padding: 0 12px; }
  .sb-right .lbl { color: var(--dim); }
  .sb-right b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
  .sb-right .cost { color: var(--done); }

  /* ── legend ────────────────────────────────────────────────────── */
  #legend {
    left: 14px; bottom: 42px;
    display: grid; grid-template-columns: auto auto; gap: 3px 18px;
    padding: 12px 14px 9px;
    color: var(--muted); font-size: 11px;
  }
  #legend span { display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
  #legend i { width: 8px; height: 8px; background: currentColor; display: inline-block; }
  #legend .l-running     { color: var(--running); }
  #legend .l-waiting     { color: var(--waiting); }
  #legend .l-done        { color: var(--done); }
  #legend .l-failed      { color: var(--failed); }
  #legend .l-interrupted { color: var(--interrupted); }
  #legend .l-idle        { color: var(--idle); }
  #legend .l-task        { color: var(--task); }
  #legend span em { font-style: normal; color: var(--muted); }

  /* ── working-now box ───────────────────────────────────────────── */
  #worknow {
    top: 54px; left: 14px;
    display: flex; flex-direction: column;
    padding: 11px 0 5px;
    max-width: min(600px, calc(100vw - 28px));
  }
  #worknow button {
    display: flex; align-items: baseline; gap: 10px; min-width: 0;
    padding: 3px 12px;
    border: 0; border-left: 2px solid transparent;
    background: transparent;
    color: var(--text); font-size: 11.5px; text-align: left;
    cursor: pointer;
  }
  #worknow button:hover { background: var(--element); border-left-color: var(--task); }
  #worknow .wn-chain { white-space: nowrap; flex: none; color: var(--muted); }
  #worknow .wn-chain::before { content: "● "; color: var(--running); }
  #worknow .wn-chain .holder { color: var(--text); font-weight: 600; }
  #worknow .wn-act {
    color: var(--dim); min-width: 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  /* ── detail sidebar ────────────────────────────────────────────── */
  #detail {
    position: fixed; z-index: 30;
    top: 36px; right: 0; bottom: 26px;
    width: 370px;
    border-left: 1px solid var(--border);
    background: var(--panel);
    overflow: hidden;
    display: flex; flex-direction: column;
    transform: translateX(100%); visibility: hidden;
    transition: transform .16s ease-out, visibility 0s linear .16s;
  }
  #detail.open { transform: none; visibility: visible; transition: transform .16s ease-out; }

  #detailClose {
    position: absolute; top: 10px; right: 12px; z-index: 2;
    padding: 0 4px; border: 0;
    background: transparent; color: var(--dim); font-size: 11px;
    cursor: pointer;
  }
  #detailClose:hover { color: var(--text); }

  #detailBody { overflow-y: auto; flex: 1; padding: 14px 16px 22px; }
  #detailBody::-webkit-scrollbar { width: 6px; }
  #detailBody::-webkit-scrollbar-track { background: transparent; }
  #detailBody::-webkit-scrollbar-thumb { background: var(--border-hi); }
  #detailBody::-webkit-scrollbar-thumb:hover { background: var(--border-act); }

  .d-kicker { color: var(--dim); font-size: 11px; }
  .d-kicker::before { content: "# "; }
  #detail h2 {
    margin: 4px 0 0; padding-right: 40px;
    font-size: 13px; font-weight: 700; line-height: 1.4; word-break: break-word;
  }
  .d-subhead {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    margin-top: 8px; padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }
  .d-since { font-size: 11px; color: var(--muted); }

  /* state badges: solid blocks like a vim mode indicator */
  .st {
    display: inline-flex; align-items: center;
    padding: 0 6px; line-height: 17px;
    font-size: 10.5px; font-weight: 700; letter-spacing: .04em;
    text-transform: uppercase;
    color: var(--bg); background: var(--idle);
  }
  .st.running     { background: var(--running); }
  .st.waiting     { background: var(--waiting); }
  .st.idle        { background: var(--element); color: var(--muted); }
  .st.failed      { background: var(--failed); }
  .st.interrupted { background: var(--interrupted); }
  .st.new         { background: var(--new); }

  #detail dl { display: grid; grid-template-columns: 76px 1fr; gap: 0; margin: 10px 0 4px; }
  #detail dt, #detail dd { padding: 3px 0; margin: 0; font-size: 11.5px; }
  #detail dt { color: var(--dim); padding-right: 8px; }
  #detail dd { word-break: break-all; color: var(--text); }

  .mono  { font-family: var(--mono); }
  .small { font-size: 11px; }
  .d-path { color: var(--muted); }

  .copy-btn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 20px; height: 17px; margin-left: 6px;
    border: 1px solid var(--border-hi);
    background: transparent; color: var(--dim);
    font-size: 11px; cursor: pointer; vertical-align: middle;
  }
  .copy-btn:hover { color: var(--accent); border-color: var(--accent); }
  .copy-btn.copied { color: var(--done); border-color: var(--done); }

  .d-section {
    margin-top: 16px; margin-bottom: 2px;
    font-size: 11.5px; font-weight: 700; color: var(--text);
  }
  .d-section::before { content: "▍"; color: var(--accent); margin-right: 4px; }

  .tokgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 18px; margin-top: 6px; }
  .tokgrid > div {
    display: flex; justify-content: space-between; align-items: baseline; gap: 8px;
    padding: 2px 0; border-bottom: 1px dashed var(--border);
  }
  .tokgrid b { order: 2; font-size: 11.5px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .tokgrid span { order: 1; color: var(--dim); font-size: 11px; }

  .d-prompt {
    margin-top: 6px; padding: 8px 10px;
    border-left: 2px solid var(--accent);
    background: var(--element);
    color: var(--muted); font-size: 11.5px; line-height: 1.5;
    white-space: pre-wrap; word-break: break-word;
  }
  .d-prompt.mono { border-left-color: var(--running); color: var(--text); }
  .kid {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    width: 100%; margin-top: 1px; padding: 4px 8px;
    border: 0; border-left: 2px solid transparent;
    background: transparent; color: var(--text);
    font-size: 11.5px; text-align: left; cursor: pointer;
  }
  .kid > span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .kid > span:first-child::before { content: "› "; color: var(--dim); }
  .kid:hover { background: var(--element); border-left-color: var(--accent); }
  .kid:hover > span:first-child::before { color: var(--accent); }

  /* ── stale banner ──────────────────────────────────────────────── */
  #stale {
    position: fixed; z-index: 25; top: 48px; left: 50%;
    transform: translateX(-50%);
    padding: 3px 12px;
    border: 1px solid var(--waiting);
    background: var(--panel);
    color: var(--waiting); font-size: 11.5px; white-space: nowrap;
  }
  #stale::before { content: "! "; font-weight: 700; }
  .hidden { display: none !important; }

  /* ── svg nodes ─────────────────────────────────────────────────── */
  .node { cursor: grab; color: var(--idle); }
  .node:active { cursor: grabbing; }
  .node .bubble { fill: rgba(128,128,128,.06); stroke: currentColor; stroke-width: 1; }

  .node .halo   { fill: none; stroke: currentColor; opacity: 0; }

  .node text {
    font-family: var(--mono);
    paint-order: stroke; stroke: var(--bg); stroke-width: 3px; stroke-linejoin: round;
  }

  /* sessions and subagents are drawn as faces; labels sit under the face */
  .node.has-face .bubble, .node.has-face .halo { display: none; }
  .node.has-face .name { fill: var(--text); }
  .node.has-face .meta { fill: var(--muted); }
  .node.has-face .tok  { fill: var(--dim); }
  .node .face-ball { stroke-width: 2; }
  .node.selected .face-ball { stroke: var(--text) !important; stroke-width: 3; }
  .node .face-sign { font-weight: 800; font-family: var(--mono); stroke: none; }

  .node.state-running     { color: var(--running); }
  .node.state-waiting     { color: var(--waiting); }
  .node.state-idle        { color: var(--idle); }
  .node.state-failed      { color: var(--failed); }
  .node.state-interrupted { color: var(--interrupted); }
  .node.state-new         { color: var(--new); }
  .node.state-new .bubble { stroke-dasharray: 3 5; }

  .node.state-running .halo { animation: halo 2.4s ease-out infinite; }
  @keyframes halo {
    0%   { opacity: .5; stroke-width: 2; }
    70%  { opacity: 0;  stroke-width: 12; }
    100% { opacity: 0;  stroke-width: 12; }
  }
  .node.state-waiting .halo { opacity: .5; stroke-dasharray: 3 6; }

  .node.kind-directory { color: var(--dir); }
  .node.kind-directory .bubble {
    fill: rgba(20,20,20,.55);
    stroke: var(--border-hi);
    stroke-dasharray: 4 4;
  }
  .node.kind-directory:hover .bubble { stroke: var(--border-act); }
  .node.kind-directory.selected .bubble { stroke: var(--accent); stroke-width: 1.5; }

  .node .name { fill: var(--text); font-weight: 600; }
  .node .meta { fill: var(--muted); }
  .node .tok  { fill: var(--dim); }
  .node.kind-directory .name { fill: var(--text); font-weight: 700; }
  .node.kind-directory .meta { fill: var(--dim); }

  .link { stroke: #2a2a2a; stroke-width: 1; vector-effect: non-scaling-stroke; }
  .link.live { stroke: rgba(250,178,131,.55); stroke-dasharray: 4 4; animation: dash 1s linear infinite; }
  .link.handoff { stroke: var(--task); stroke-width: 1.5; stroke-dasharray: 6 4; animation: dash .8s linear infinite; }
  @keyframes dash { to { stroke-dashoffset: -16; } }

  /* what the agent is doing right now, under the face */
  .node .act { fill: var(--muted); }
  .node.holder .act { fill: var(--task); }

  /* the agent currently holding a task */
  .node .ring { fill: none; stroke: var(--task); stroke-width: 1.5; stroke-dasharray: 8 6; opacity: 0; }
  .node.holder .ring { opacity: .9; animation: spin 6s linear infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* an agent that handed its work to a subagent and is waiting on it */
  .node.delegating .bubble { fill-opacity: .45; stroke-dasharray: 4 3; }
  .node.delegating .halo { animation: none; opacity: 0; }

  /* task tokens travelling between faces */
  .token { pointer-events: none; }
  .token .glow { fill: var(--task); opacity: .2; animation: tokpulse 1.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .token .core { fill: var(--task); stroke: var(--bg); stroke-width: 1.5; }
  .token text {
    fill: var(--task); font-family: var(--mono); font-size: 10.5px; font-weight: 600;
    paint-order: stroke; stroke: var(--bg); stroke-width: 3.5px; stroke-linejoin: round;
  }
  .token.result-failed .glow, .token.result-failed .core { fill: var(--failed); }
  .token.result-failed text { fill: var(--failed); }
  .token.result-interrupted .glow, .token.result-interrupted .core { fill: var(--interrupted); }
  .token.result-interrupted text { fill: var(--interrupted); }
  .token.result-done .glow, .token.result-done .core { fill: var(--done); }
  .token.result-done text { fill: var(--done); }
  @keyframes tokpulse { 50% { transform: scale(1.35); opacity: .08; } }

  @media (prefers-reduced-motion: reduce) {
    .node.state-running .halo, .link.live, .link.handoff, .live-dot.live,
    .node.holder .ring, .token .glow { animation: none; }
    #detail { transition: none; }
  }
  @media (max-width: 900px) {
    .keys { display: none; }
    .brand .sub { display: none; }
  }
  @media (max-width: 720px) {
    .chips .chip:not(.running):not(.waiting) { display: none; }
    .brand .crumb, .brand .page { display: none; }
    .sb-right .opt { display: none; }
    #legend { grid-template-columns: auto; }
    #detail { width: 100%; border-left: 0; }
  }
</style>
</head>
<body>

<header id="topbar">
  <div class="brand">
    <span class="wordmark"><span class="w-open">open</span><span class="w-code">code</span></span>
    <span class="crumb">/</span><span class="page">agent-monitor</span>
    <span class="live"><span class="live-dot" id="liveDot"></span><span id="liveText">connecting</span></span>
    <span class="sub" id="serverInfo"></span>
  </div>
  <div class="chips" id="chips"></div>
</header>

<svg id="stage" aria-label="OpenCode session map"></svg>

<div id="legend" class="box">
  <span class="box-title">legend</span>
  <span class="l-running"><i></i><em>working</em></span>
  <span class="l-waiting"><i></i><em>needs approval</em></span>
  <span class="l-done"><i></i><em>just finished</em></span>
  <span class="l-failed"><i></i><em>failed</em></span>
  <span class="l-interrupted"><i></i><em>interrupted</em></span>
  <span class="l-idle"><i></i><em>idle</em></span>
  <span class="l-task"><i></i><em>task handoff</em></span>
</div>

<div id="worknow" class="box hidden"></div>

<aside id="detail" aria-live="polite">
  <button id="detailClose" aria-label="close">[esc]</button>
  <div id="detailBody"></div>
</aside>

<div id="stale" class="hidden">opencode unreachable · showing last snapshot</div>

<footer id="statusbar">
  <div class="sb-left">
    <span class="sb-mode" id="sbMode">LIVE</span>
    <span class="keys">
      <span><kbd>drag</kbd> pan</span>
      <span><kbd>scroll</kbd> zoom</span>
      <span><kbd>dblclick</kbd> fit</span>
      <span><kbd>click</kbd> inspect</span>
      <span><kbd>esc</kbd> close</span>
    </span>
  </div>
  <div class="sb-right" id="today" title="Token usage since local midnight. Cache reads are listed separately.">
    <span><span class="lbl">today</span> <b id="todayValue">—</b></span>
    <span class="opt" id="todaySub"></span>
    <span class="opt" id="todayCache"></span>
    <span class="cost" id="todayCost"></span>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script>
"use strict";

const SVG = d3.select("#stage");
const linkLayer = SVG.append("g").attr("class", "links");
const nodeLayer = SVG.append("g").attr("class", "nodes");
const tokenLayer = SVG.append("g").attr("class", "tokens");

const REDUCED_MOTION = matchMedia("(prefers-reduced-motion: reduce)").matches;
const TOKEN_OUT_MS = REDUCED_MOTION ? 0 : 1100;
const TOKEN_BACK_MS = REDUCED_MOTION ? 0 : 1300;
const TOKEN_LINGER_MS = REDUCED_MOTION ? 1500 : 700;
const ARROW = "→";

let W = innerWidth;
let H = innerHeight;

const view = {
  data: null,
  nodes: [],
  links: [],
  byId: new Map(),
  sim: null,
  selected: null,
  hashHandled: false,
  handoffs: null,          // Map key -> active handoff; null until the first snapshot
  tokens: new Map(),       // Map key -> token being drawn (out / rest / back)
  holders: new Set(),      // node ids currently holding a task
  delegating: new Map(),   // node id -> [child agent names]
};

let nodeSel = null;
let linkSel = null;

const zoom = d3.zoom()
  .scaleExtent([0.2, 2.6])
  .on("zoom", (event) => {
    linkLayer.attr("transform", event.transform);
    nodeLayer.attr("transform", event.transform);
    tokenLayer.attr("transform", event.transform);
  });

SVG.call(zoom).on("dblclick.zoom", null);
SVG.on("dblclick", () => fitView());

const drag = d3.drag()
  .on("start", (event, d) => {
    event.sourceEvent.stopPropagation();
    if (!event.active) view.sim.alphaTarget(0.3).restart();
    d.fx = d.x;
    d.fy = d.y;
  })
  .on("drag", (event, d) => {
    const t = d3.zoomTransform(SVG.node());
    d.fx += event.dx / t.k;
    d.fy += event.dy / t.k;
  })
  .on("end", (event, d) => {
    if (!event.active) view.sim.alphaTarget(0);
    if (d.kind !== "directory") { d.fx = null; d.fy = null; }
  });

/* ---------------------------------------------------------------- helpers -- */

const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

function fmtTok(n) {
  n = Number(n) || 0;
  if (n >= 1e9) return (n / 1e9).toFixed(2) + "B";
  if (n >= 1e6) return (n / 1e6).toFixed(2) + "M";
  if (n >= 1e3) return (n / 1e3).toFixed(1) + "k";
  return String(Math.round(n));
}

function fmtDur(ms) {
  const s = Math.max(0, Math.floor((ms || 0) / 1000));
  if (s < 60) return s + "s";
  const m = Math.floor(s / 60);
  if (m < 60) return m + "m " + String(s % 60).padStart(2, "0") + "s";
  const h = Math.floor(m / 60);
  if (h < 24) return h + "h " + String(m % 60).padStart(2, "0") + "m";
  return Math.floor(h / 24) + "d " + (h % 24) + "h";
}

function fmtDate(ms) {
  if (!ms) return "—";
  return new Date(ms).toLocaleString([], {
    month: "short", day: "numeric",
    hour: "2-digit", minute: "2-digit", second: "2-digit",
  });
}

function fmtMoney(v) {
  const n = Number(v) || 0;
  return "$" + n.toFixed(n > 0 && n < 0.01 ? 4 : 2);
}

function truncate(text, max) {
  const s = String(text == null ? "" : text);
  if (s.length <= max) return s;
  return s.slice(0, Math.max(1, max - 1)).trimEnd() + "…";
}

function esc(value) {
  return String(value == null ? "" : value).replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[c]));
}

/* ------------------------------------------------------------ flatten ---- */

function flatten(data) {
  const nodes = [];
  const links = [];

  for (const dir of data.directories) {
    const dnode = {
      id: "dir:" + dir.id,
      kind: "directory",
      r: 92,
      label: dir.label,
      dirData: dir,
      parent: null,
    };
    nodes.push(dnode);

    const walk = (session, parent) => {
      const isSub = !!session.parentId;

      const node = {
        id: session.id,
        kind: isSub ? "subagent" : "session",
        r: isSub ? 28 : 48,
        data: session,
        dir: dnode,
        parent: parent,
      };

      nodes.push(node);
      links.push({
        key: (parent ? parent.id : dnode.id) + "->" + session.id,
        source: parent ? parent.id : dnode.id,
        target: session.id,
        live: session.state === "running",
      });

      for (const child of session.children || []) walk(child, node);
    };

    for (const session of dir.sessions || []) walk(session, null);
  }

  return { nodes, links };
}

function placeDirectories(nodes) {
  const dirs = nodes.filter((n) => n.kind === "directory");
  const n = dirs.length;
  if (!n) return;

  const cx = W / 2;
  const cy = H / 2 + 12;
  const ring = n <= 1 ? 0 : Math.min(W, H) * (n <= 4 ? 0.25 : n <= 8 ? 0.32 : 0.38);

  dirs.forEach((d, i) => {
    if (Number.isFinite(d.fx)) return;
    const angle = (i / n) * Math.PI * 2 - Math.PI / 2;
    d.fx = n === 1 ? cx : cx + Math.cos(angle) * ring;
    d.fy = n === 1 ? cy : cy + Math.sin(angle) * ring;
    d.x = d.fx;
    d.y = d.fy;
  });
}

function xTarget(d) {
  if (d.kind === "directory") return d.fx;
  if (d.parent) return d.parent.x;
  return d.dir ? d.dir.fx : W / 2;
}

function yTarget(d) {
  if (d.kind === "directory") return d.fy;
  if (d.parent) return d.parent.y;
  return d.dir ? d.dir.fy : H / 2;
}

function xyStrength(d) {
  return d.kind === "directory" ? 0 : 0.045;
}

/* -------------------------------------------------------------- labels --- */

function nodeGeometry(d) {
  if (d.kind === "directory") return { name: -8, meta: 13, tok: 99, act: 99 };
  // Faces fill the circle, so their labels sit underneath.
  if (d.kind === "subagent") return { name: d.r + 15, meta: d.r + 27, tok: 0, act: d.r + 39 };
  return { name: d.r + 17, meta: d.r + 30, tok: d.r + 42, act: d.r + 54 };
}

function labelParts(d) {
  if (d.kind === "directory") {
    return [
      truncate(d.label, 15) + "/",
      truncate(
        d.dirData.runningCount + " running · " +
        d.dirData.sessionCount + " session" + (d.dirData.sessionCount === 1 ? "" : "s"),
        30
      ),
      "",
    ];
  }

  const s = d.data;
  const t = s.tokens || {};
  const stateText = view.delegating.has(d.id)
    ? "delegating"
    : s.stateDetail ? s.state + " · " + s.stateDetail : s.state;
  const elapsed = s.state === "running" && s.runningSince
    ? fmtDur(Date.now() - s.runningSince)
    : "";

  return [
    truncate(s.agent || s.name, 20),
    truncate(stateText, 28),
    d.kind === "subagent"
      ? ""
      : (elapsed ? elapsed + " · " : "") + fmtTok(t.total) + " tok",
  ];
}

function tooltipText(d) {
  if (d.kind === "directory") {
    return d.dirData.path + "\n" + d.dirData.runningCount + " running · " + d.dirData.sessionCount + " sessions";
  }
  const s = d.data;
  return [
    s.agent ? s.agent + " · " + s.name : s.name,
    s.state + (s.stateDetail ? " · " + s.stateDetail : ""),
    s.activityFull ? "now: " + s.activityFull : "",
    s.task ? "task: " + s.task : "",
    fmtTok(s.tokens && s.tokens.total) + " tokens · " + fmtMoney(s.cost),
    s.model || "",
    d.dir ? d.dir.dirData.path : "",
    s.id,
  ].filter(Boolean).join("\n");
}

/* ------------------------------------------------------------ handoffs --- */

const linkEnd = (end) => (typeof end === "object" && end ? end.id : end);

// Turn each running `subagent` call into a handoff between two bubbles.
function resolveHandoffs(nodes, byId) {
  const handoffs = new Map();

  for (const n of nodes) {
    if (n.kind === "directory") continue;
    const s = n.data;
    if (s.state !== "running" && s.state !== "waiting") continue;

    const used = new Set();
    for (const del of s.delegations || []) {
      let child = del.childId ? byId.get(del.childId) : null;

      if (!child) {
        // The call may not name its child session yet: take the newest matching child.
        const candidates = (s.children || [])
          .filter((c) => !used.has(c.id) && byId.has(c.id))
          .filter((c) => !del.agent || c.agent === del.agent)
          .filter((c) => c.state === "running" || c.state === "waiting" || c.state === "new")
          .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
        child = candidates.length ? byId.get(candidates[0].id) : null;
      }
      if (!child) continue;

      used.add(child.id);
      const key = n.id + "=>" + child.id;
      handoffs.set(key, {
        key,
        parentId: n.id,
        childId: child.id,
        agent: del.agent || child.data.agent || "subagent",
        label: del.description || child.data.task || del.agent || "task",
      });
    }
  }

  return handoffs;
}

function updateHandoffs(flat, byId) {
  const current = resolveHandoffs(flat.nodes, byId);
  const now = performance.now();
  const firstSnapshot = view.handoffs === null;

  for (const [key, h] of current) {
    const token = view.tokens.get(key);
    if (!token) {
      // On page load, existing handoffs are shown in place instead of replayed.
      view.tokens.set(key, Object.assign({}, h, { phase: firstSnapshot ? "rest" : "out", start: now, result: null }));
    } else {
      token.label = h.label;
      if (token.phase === "back") { token.phase = "rest"; token.result = null; token.pos = null; token.reacted = false; }
    }
  }

  if (!firstSnapshot) {
    for (const [key, h] of view.handoffs) {
      if (current.has(key)) continue;
      const token = view.tokens.get(key);
      if (!token || token.phase === "back") continue;

      const child = byId.get(h.childId);
      const state = child ? child.data.state : "idle";
      token.phase = "back";
      token.start = now;
      token.result = state === "failed" ? "failed" : state === "interrupted" ? "interrupted" : "done";
    }
  }

  view.handoffs = current;

  view.delegating = new Map();
  for (const h of current.values()) {
    if (!view.delegating.has(h.parentId)) view.delegating.set(h.parentId, []);
    view.delegating.get(h.parentId).push(h.agent);
  }

  view.holders = new Set(
    flat.nodes
      .filter((n) => n.kind !== "directory" && n.data.state === "running" && !view.delegating.has(n.id))
      .map((n) => n.id)
  );

  for (const l of flat.links) {
    l.handoff = current.has(linkEnd(l.source) + "=>" + linkEnd(l.target));
  }
}

function restPoint(child) {
  // The token sits on the upper-right rim of the bubble that holds the task.
  // Upper left: the thought bubble already occupies the upper right of a face.
  return { x: child.x - child.r * 0.78, y: child.y - child.r * 0.66 };
}

function tokenFrame(token, now) {
  const parent = view.byId.get(token.parentId);
  const child = view.byId.get(token.childId);

  if (!parent || !child || !Number.isFinite(parent.x) || !Number.isFinite(child.x)) {
    if (token.phase === "back" && token.last) return Object.assign({}, token.last, { opacity: 0, done: true });
    return null;
  }

  const dx = child.x - parent.x;
  const dy = child.y - parent.y;
  const dist = Math.sqrt(dx * dx + dy * dy) || 1;
  const ux = dx / dist;
  const uy = dy / dist;
  const rest = restPoint(child);

  if (token.phase === "out") {
    const t = TOKEN_OUT_MS ? clamp((now - token.start) / TOKEN_OUT_MS, 0, 1) : 1;
    if (t >= 1) {
      token.phase = "rest";
      token.pos = null;
      const rig = rigs.get(token.childId);
      if (rig) rig.react("surprised", 700);   // the task just landed
    }
    const e = d3.easeCubicInOut(t);
    const fromX = parent.x + ux * parent.r;
    const fromY = parent.y + uy * parent.r;
    // A slight arc so the token reads as travelling, not sliding along the link.
    const lift = Math.sin(Math.PI * e) * Math.min(40, dist * 0.18);
    const frame = {
      x: fromX + (rest.x - fromX) * e + uy * lift,
      y: fromY + (rest.y - fromY) * e - ux * lift,
      opacity: 1,
      scale: 0.7 + 0.3 * e,
    };
    if (token.phase === "out") token.pos = frame;   // faces watch the token fly
    return frame;
  }

  if (token.phase === "back") {
    const elapsed = now - token.start;
    const t = TOKEN_BACK_MS ? clamp(elapsed / TOKEN_BACK_MS, 0, 1) : 1;
    const e = d3.easeCubicInOut(t);
    const toX = parent.x + ux * parent.r * 0.55;
    const toY = parent.y + uy * parent.r * 0.55;
    const lift = Math.sin(Math.PI * e) * Math.min(40, dist * 0.18);
    const linger = elapsed - TOKEN_BACK_MS;
    const frame = {
      x: rest.x + (toX - rest.x) * e - uy * lift,
      y: rest.y + (toY - rest.y) * e + ux * lift,
      opacity: linger <= 0 ? 1 : clamp(1 - linger / TOKEN_LINGER_MS, 0, 1),
      scale: 1,
      done: linger >= TOKEN_LINGER_MS,
    };
    token.last = frame;
    token.pos = linger <= 0 ? frame : null;
    if (linger >= 0 && !token.reacted) {
      // The result arrived: the parent beams or looks worried.
      token.reacted = true;
      const rig = rigs.get(token.parentId);
      if (rig) rig.react(token.result === "done" ? "joy" : "worried", 1700);
    }
    return frame;
  }

  return { x: rest.x, y: rest.y, opacity: 1, scale: 1 };
}

function tokenLabel(token) {
  if (token.phase === "back") {
    if (token.result === "failed") return "✗ failed";
    if (token.result === "interrupted") return "■ interrupted";
    return "✓ done";
  }
  return truncate(token.label, 34);
}

function drawTokens() {
  const now = performance.now();
  const frames = [];

  for (const [key, token] of view.tokens) {
    const frame = tokenFrame(token, now);
    if (frame && frame.done) { view.tokens.delete(key); continue; }
    if (!frame) continue;
    frames.push({ key, token, frame });
  }

  const join = tokenLayer.selectAll("g.token").data(frames, (d) => d.key);
  join.exit().remove();

  const enter = join.enter().append("g").attr("class", "token");
  enter.append("circle").attr("class", "glow").attr("r", 11);
  enter.append("circle").attr("class", "core").attr("r", 5.5);
  enter.append("text").attr("x", 10).attr("y", 4);

  const all = enter.merge(join);
  all
    .attr("class", (d) => "token" + (d.token.phase === "back" ? " result-" + d.token.result : ""))
    .attr("opacity", (d) => d.frame.opacity)
    .attr("transform", (d) =>
      "translate(" + d.frame.x.toFixed(1) + "," + d.frame.y.toFixed(1) + ") scale(" + d.frame.scale + ")");

  // A resting token sits left of its face, so its label reads leftwards.
  all.select("text")
    .attr("x", (d) => d.token.phase === "rest" ? -10 : 10)
    .attr("text-anchor", (d) => d.token.phase === "rest" ? "end" : "start")
    .text((d) => tokenLabel(d.token));
}

d3.timer(drawTokens);

function captionText(d) {
  if (d.kind === "directory") return "";
  const s = d.data;
  let text = "";

  if (view.delegating.has(d.id)) {
    text = "delegated " + ARROW + " " + Array.from(new Set(view.delegating.get(d.id))).join(", ");
  } else if (s.state === "running") {
    text = s.activity || "";
  } else if (s.state === "waiting") {
    text = "needs approval" + (s.stateDetail ? ": " + s.stateDetail : "");
  }

  return truncate(text, d.kind === "subagent" ? 30 : 40);
}

function updateWorkNow() {
  const box = document.getElementById("worknow");
  const holders = Array.from(view.holders)
    .map((id) => view.byId.get(id))
    .filter(Boolean)
    .sort((a, b) => (a.data.runningSince || 0) - (b.data.runningSince || 0))
    .slice(0, 6);

  if (!holders.length) {
    box.classList.add("hidden");
    box.innerHTML = "";
    return;
  }

  let html = '<span class="box-title"><b>working now</b> · ' + holders.length + "</span>";
  for (const node of holders) {
    const chain = [];
    for (let n = node; n; n = n.parent) chain.unshift(n);
    const names = chain.map((n, i) => {
      const label = esc(n.data.agent || n.data.name);
      return i === chain.length - 1 ? '<span class="holder">' + label + "</span>" : label;
    });
    const act = node.data.activity || node.data.stateDetail || "";
    html += '<button data-id="' + esc(node.id) + '" title="' + esc(node.data.activityFull || act) + '">' +
      '<span class="wn-chain">' + names.join(" " + ARROW + " ") + "</span>" +
      '<span class="wn-act">' + esc(act) + "</span>" +
      "</button>";
  }

  box.innerHTML = html;
  box.classList.remove("hidden");
}

document.getElementById("worknow").addEventListener("click", (event) => {
  const button = event.target.closest("[data-id]");
  if (!button) return;
  const node = view.byId.get(button.getAttribute("data-id"));
  if (node) selectNode(node);
});

/* --------------------------------------------------------------- faces --- */
// Every session and subagent is drawn as a flat smiley whose expression shows
// its status and whose eyes follow what matters (a task token, its subagents,
// its work, or the mouse).

const SVGNS = "http://www.w3.org/2000/svg";
const FACE_INK = "#141414";

// [fill, outline] per face status
const FACE_PALETTE = {
  idle:        ["#8a8a8a", "#4a4a4a"],
  running:     ["#fab283", "#b9784c"],
  delegating:  ["#fab283", "#b9784c"],
  waiting:     ["#e5c07b", "#a8873f"],
  done:        ["#7fd88f", "#4a9a58"],
  failed:      ["#e06c75", "#9e3f47"],
  interrupted: ["#9d7cd8", "#6a4fa3"],
};

// Each expression is a text emoticon: one glyph for the eyes, one for the mouth.
//   eyes:  dot .   ring o   line -   caret ^   not ¬   wince > <
//   mouth: line _   dot .   o o
//   bigL / bigR turn a ring eye into a big O, comma adds the tail of a ; under each eye.
//   mw mouth width, mx mouth shift, tilt crooked mouth, think / ask / zz extras.
const EYE_GLYPHS = ["dot", "ring", "line", "caret", "not", "wince"];
const MOUTH_GLYPHS = ["line", "dot", "o"];

const FACE_NEUTRAL = {
  bigL: 0, bigR: 0, comma: 0,
  mw: .75, mx: 0, tilt: 0,
  think: 0, ask: 0, zz: 0,
};
for (const g of EYE_GLYPHS) FACE_NEUTRAL["e_" + g] = 0;
for (const g of MOUTH_GLYPHS) FACE_NEUTRAL["m_" + g] = 0;

const FACE_EXPRESSIONS = {
  idle:      { eyes: "dot",   mouth: "line" },                       // ._.
  sleepy:    { eyes: "line",  mouth: "dot", zz: 1 },                 // -.-  z
  thinking:  { eyes: "dot",   mouth: "line", mw: .6, think: 1 },     // ._.  ...
  watching:  { eyes: "ring",  mouth: "line" },                       // o_o
  asking:    { eyes: "ring",  mouth: "line", bigR: 1, tilt: -.4, ask: 1 },      // o_O  ?
  happy:     { eyes: "caret", mouth: "line" },                       // ^_^
  joy:       { eyes: "caret", mouth: "o" },                          // ^o^
  sad:       { eyes: "dot",   mouth: "line", comma: 1 },             // ;_;
  annoyed:   { eyes: "not",   mouth: "line" },                       // ¬_¬
  surprised: { eyes: "ring",  mouth: "line", bigL: 1, bigR: 1 },     // O_O
  worried:   { eyes: "wince", mouth: "line", mw: .6 },               // >_<
};

function expressionGoal(name) {
  const x = FACE_EXPRESSIONS[name] || FACE_EXPRESSIONS.idle;
  const goal = Object.assign({}, FACE_NEUTRAL);
  for (const k in x) if (k !== "eyes" && k !== "mouth") goal[k] = x[k];
  goal["e_" + x.eyes] = 1;
  goal["m_" + x.mouth] = 1;
  return goal;
}

const rigs = new Map();      // session id -> FaceRig
let mouseClient = null;

const f2 = (n) => n.toFixed(2);
const approach = (v, target, rate, dt) => v + (target - v) * (1 - Math.exp(-rate * dt));
const rand = (a, b) => a + Math.random() * (b - a);

function svgEl(tag, attrs, parent) {
  const node = document.createElementNS(SVGNS, tag);
  for (const k in attrs) node.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(node);
  return node;
}

class FaceRig {
  constructor(g, d) {
    this.id = d.id;
    this.r = d.r;
    this.sub = d.kind === "subagent";
    this.status = "idle";
    this.lastState = null;
    this.doneUntil = 0;
    this.phase = rand(0, Math.PI * 2);
    this.lidBlink = 1;
    this.blinkUntil = 0;
    this.nextBlink = performance.now() + rand(800, 3000);
    this.gx = 0; this.gy = 0;
    this.nextGlance = 0;
    this.glance = null;
    this.focusIndex = 0;
    this.reaction = null;
    this.e = expressionGoal("idle");
    this.build(g);
    this.paint("idle");
  }

  build(g) {
    const r = this.r;
    this.root = svgEl("g", { class: "face" });
    g.insertBefore(this.root, g.querySelector("text.name"));
    this.ball = svgEl("circle", { class: "face-ball", r }, this.root);

    this.features = svgEl("g", {}, this.root);
    const ink = { fill: "none", stroke: FACE_INK, "stroke-width": f2(r * .07), "stroke-linecap": "round", "stroke-linejoin": "round", opacity: 0 };
    const path = (d, parent) => svgEl("path", Object.assign({ d }, ink), parent);
    const P = (x, y) => f2(x * r) + " " + f2(y * r);

    this.eyes = [-1, 1].map((side) => {
      const wrap = svgEl("g", {}, this.features);
      const lid = svgEl("g", {}, wrap);   // squashed when blinking
      const glyph = {
        dot:   svgEl("circle", { r: f2(r * .1), fill: FACE_INK, opacity: 0 }, lid),
        ring:  svgEl("circle", Object.assign({}, ink, { "stroke-width": f2(r * .06) }), lid),
        line:  path("M " + P(-.12, 0) + " L " + P(.12, 0), wrap),
        caret: path("M " + P(-.12, .06) + " L " + P(0, -.08) + " L " + P(.12, .06), wrap),
        not:   path("M " + P(-.13, -.04) + " L " + P(.12, -.04) + " L " + P(.12, .08), wrap),
        // > on the left, < on the right: both point at the nose
        wince: path("M " + P(side * .09, -.09) + " L " + P(-side * .09, 0) + " L " + P(side * .09, .09), wrap),
      };
      // the lower half of a ; under the eye
      const comma = path("M " + P(.03, .17) + " Q " + P(.04, .27) + " " + P(-.05, .32), wrap);
      return { side, wrap, lid, glyph, comma };
    });

    this.mouth = {
      line: path("", this.features),
      dot:  svgEl("circle", { r: f2(r * .065), fill: FACE_INK, opacity: 0 }, this.features),
      o:    svgEl("ellipse", Object.assign({}, ink, { rx: f2(r * .1), ry: f2(r * .12), "stroke-width": f2(r * .06) }), this.features),
    };

    this.thought = svgEl("g", { opacity: 0 }, this.root);
    const bx = r * 1.05, by = -r * 1.38;
    const cloud = { fill: "#eeeeee", stroke: "#0a0a0a", "stroke-width": 1.5 };
    svgEl("circle", Object.assign({ cx: r * .62, cy: -r * .82, r: r * .07 }, cloud), this.thought);
    svgEl("circle", Object.assign({ cx: r * .78, cy: -r * 1.02, r: r * .11 }, cloud), this.thought);
    svgEl("ellipse", Object.assign({ cx: bx, cy: by, rx: r * .56, ry: r * .34 }, cloud), this.thought);
    this.thinkDots = [-1, 0, 1].map((i) =>
      svgEl("circle", { cx: bx + i * r * .2, cy: by, r: r * .065, fill: FACE_INK }, this.thought));

    this.ask = svgEl("text", {
      class: "face-sign", x: r * .62, y: -r * .62, "font-size": r * .62, fill: "#e5c07b", opacity: 0,
    }, this.root);
    this.ask.textContent = "?";

    this.zz = [0, 1].map(() => {
      const t = svgEl("text", { class: "face-sign", "font-size": r * .32, fill: "#808080", opacity: 0 }, this.root);
      t.textContent = "z";
      return t;
    });
  }

  remove() { this.root.remove(); }

  // Map the session's state (from the snapshot) to a face status.
  setData(d) {
    const s = d.data;
    const busy = (st) => st === "running" || st === "waiting";
    if (this.sub && busy(this.lastState) && !busy(s.state) && s.state !== "failed" && s.state !== "interrupted") {
      this.doneUntil = performance.now() + 4000;
    }
    this.lastState = s.state;

    let status = "idle";
    if (s.state === "failed") status = "failed";
    else if (s.state === "interrupted") status = "interrupted";
    else if (s.state === "waiting") status = "waiting";
    else if (s.state === "running") status = view.delegating.has(d.id) ? "delegating" : "running";
    else if (performance.now() < this.doneUntil) status = "done";

    if (status !== this.status) this.paint(status);
  }

  paint(status) {
    this.status = status;
    const [fill, stroke] = FACE_PALETTE[status];
    this.ball.style.fill = fill;
    this.ball.style.stroke = stroke;
  }

  react(kind, ms) {
    this.reaction = { kind, until: performance.now() + ms };
  }

  expression() {
    switch (this.status) {
      case "running": return "thinking";
      case "delegating": return "watching";
      case "waiting": return "asking";
      case "done": return "happy";
      case "failed": return "sad";
      case "interrupted": return "annoyed";
      default: return this.sub ? "sleepy" : "idle";
    }
  }

  // Where the face looks, in simulation coordinates.
  chooseLook(node, now) {
    for (const token of view.tokens.values()) {
      if (token.pos && token.phase !== "rest" && (token.parentId === this.id || token.childId === this.id)) {
        return token.pos;
      }
    }

    const r = this.r;
    switch (this.status) {
      case "delegating": {
        const kids = view.nodes.filter((n) => n.parent && n.parent.id === this.id &&
          rigs.has(n.id) && rigs.get(n.id).status === "running");
        if (kids.length) {
          if (now > this.nextGlance) {
            this.focusIndex = (this.focusIndex + 1) % kids.length;
            this.nextGlance = now + rand(1100, 2200);
          }
          return kids[this.focusIndex % kids.length];
        }
        break;
      }
      case "running":
        if (now > this.nextGlance) {
          this.glance = Math.random() < .3 ? { dx: -r * .3, dy: r * 3 } : null;
          this.nextGlance = now + (this.glance ? rand(600, 1000) : rand(1800, 3400));
        }
        return this.glance
          ? { x: node.x + this.glance.dx, y: node.y + this.glance.dy }
          : { x: node.x + r * 1.3, y: node.y - r * 1.8 + Math.sin(now / 900) * r * .3 };
      case "waiting":
        return this.mouseWorld() || node;
      case "failed":
        // Sad faces look at you when the mouse is around, otherwise at the ground.
        return this.mouseWorld() || { x: node.x + Math.sin(now / 1600 + this.phase) * r, y: node.y + r * 3 };
      case "interrupted":
        return { x: node.x - r * 3, y: node.y + r * .3 };
      case "done":
        return node.parent || node;
    }

    if (this.sub) return { x: node.x, y: node.y + r * 2 };
    const mouse = this.mouseWorld();
    if (mouse) return mouse;
    if (now > this.nextGlance) {
      const busy = view.nodes.filter((n) => n.id !== this.id && rigs.has(n.id) &&
        (rigs.get(n.id).status === "running" || rigs.get(n.id).status === "delegating"));
      this.glance = busy.length && Math.random() < .6
        ? busy[Math.floor(Math.random() * busy.length)].id
        : null;
      this.nextGlance = now + rand(1200, 3200);
    }
    const target = this.glance && view.byId.get(this.glance);
    return target || { x: node.x, y: node.y + 50 };
  }

  mouseWorld() {
    if (!mouseClient) return null;
    const [x, y] = d3.zoomTransform(SVG.node()).invert(mouseClient);
    return { x, y };
  }

  update(node, now, dt) {
    const target = this.chooseLook(node, now);
    const dx = (target.x || 0) - node.x;
    const dy = (target.y || 0) - node.y;
    const dist = Math.hypot(dx, dy) || 1;
    const strength = clamp(dist / (this.r * 2.2), 0, 1);
    this.gx = approach(this.gx, (dx / dist) * strength, 9, dt);
    this.gy = approach(this.gy, (dy / dist) * strength, 9, dt);

    const reaction = this.reaction && now < this.reaction.until ? this.reaction.kind : null;
    const goal = expressionGoal(reaction || this.expression());
    if (this.status === "running" && !reaction) goal.mx += Math.sin(now / 700 + this.phase) * .05;

    // Only . and o eyes blink; - ^ ¬ > < stay as they are.
    const eyesOpen = goal.e_dot + goal.e_ring > .5;
    if (!eyesOpen) {
      this.blinkUntil = 0;
    } else if (now > this.nextBlink) {
      this.blinkUntil = now + 130;
      this.nextBlink = now + (Math.random() < .2 ? 260 : rand(1800, 5200));
    }
    const blinking = now < this.blinkUntil;
    this.lidBlink = approach(this.lidBlink, blinking ? .05 : 1, blinking ? 40 : 14, dt);

    for (const key in this.e) this.e[key] = approach(this.e[key], goal[key], 8, dt);
  }

  render(now) {
    const r = this.r;
    const e = this.e;

    this.features.setAttribute("transform", "translate(" + f2(this.gx * r * .2) + "," + f2(this.gy * r * .16) + ")");

    const lid = clamp(this.lidBlink, .04, 1);
    for (const eye of this.eyes) {
      const ex = eye.side * r * .4 + this.gx * r * .035;
      const ey = this.gy * r * .03;
      eye.wrap.setAttribute("transform", "translate(" + f2(ex) + "," + f2(ey) + ")");
      eye.lid.setAttribute("transform", "scale(1," + lid.toFixed(3) + ")");
      const big = eye.side < 0 ? e.bigL : e.bigR;
      eye.glyph.ring.setAttribute("r", f2(r * (.1 + .07 * big)));
      for (const g of EYE_GLYPHS) eye.glyph[g].setAttribute("opacity", f2(clamp(e["e_" + g], 0, 1)));
      eye.comma.setAttribute("opacity", f2(clamp(e.comma, 0, 1)));
    }

    const cx = e.mx * r;
    const w = r * .3 * e.mw;
    const y0 = r * .2;
    const tilt = e.tilt * r * .06;
    this.mouth.line.setAttribute("d",
      "M " + f2(cx - w) + " " + f2(y0 + tilt) + " L " + f2(cx + w) + " " + f2(y0 - tilt));
    this.mouth.dot.setAttribute("cx", f2(cx));
    this.mouth.dot.setAttribute("cy", f2(y0));
    this.mouth.o.setAttribute("cx", f2(cx));
    this.mouth.o.setAttribute("cy", f2(y0));
    for (const g of MOUTH_GLYPHS) this.mouth[g].setAttribute("opacity", f2(clamp(e["m_" + g], 0, 1)));

    this.thought.setAttribute("opacity", f2(clamp(e.think, 0, 1)));
    if (e.think > .02) {
      this.thinkDots.forEach((dot, i) => {
        const b = REDUCED_MOTION ? 0 : Math.max(0, Math.sin(now / 220 - i * .9));
        dot.setAttribute("transform", "translate(0," + f2(-b * r * .07) + ")");
        dot.setAttribute("opacity", f2(.45 + .55 * b));
      });
    }

    this.ask.setAttribute("opacity", f2(clamp(e.ask, 0, 1)));
    this.zz.forEach((z, i) => {
      const p = (now / 2400 + i * .5) % 1;
      z.setAttribute("x", f2(r * (.55 + p * .35)));
      z.setAttribute("y", f2(-r * (.55 + p * .6)));
      z.setAttribute("font-size", f2(r * (.22 + p * .2)));
      z.setAttribute("opacity", f2(clamp(e.zz, 0, 1) * Math.sin(Math.PI * p)));
    });
  }
}

// Create, rebuild or drop face rigs to match the current nodes.
function syncFaces() {
  const alive = new Set();
  nodeSel.each(function (d) {
    if (d.kind === "directory") return;
    alive.add(d.id);
    let rig = rigs.get(d.id);
    if (rig && (rig.r !== d.r || !this.contains(rig.root))) { rig.remove(); rig = null; }
    if (!rig) {
      rig = new FaceRig(this, d);
      rigs.set(d.id, rig);
    }
    rig.sub = d.kind === "subagent";
    rig.setData(d);
  });
  for (const [id, rig] of rigs) {
    if (!alive.has(id)) { rig.remove(); rigs.delete(id); }
  }
}

let lastFaceFrame = performance.now();
d3.timer(() => {
  const now = performance.now();
  const dt = Math.min(.05, (now - lastFaceFrame) / 1000);
  lastFaceFrame = now;
  for (const [id, rig] of rigs) {
    const node = view.byId.get(id);
    if (!node || !Number.isFinite(node.x)) continue;
    rig.update(node, now, dt);
    rig.render(now);
  }
});

SVG.on("pointermove.face", (event) => { mouseClient = [event.offsetX, event.offsetY]; })
   .on("pointerleave.face", () => { mouseClient = null; });

/* -------------------------------------------------------------- render --- */

function render(data) {
  view.data = data;

  const flat = flatten(data);
  const previous = view.byId;

  let topologyChanged =
    flat.nodes.length !== view.nodes.length ||
    flat.links.length !== view.links.length ||
    flat.nodes.some((n) => !previous.has(n.id));

  let radiusChanged = false;
  for (const n of flat.nodes) {
    const old = previous.get(n.id);
    if (!old || Math.abs(old.r - n.r) >= 3) radiusChanged = true;
  }

  placeDirectories(flat.nodes);

  for (const n of flat.nodes) {
    const old = previous.get(n.id);
    if (old && Number.isFinite(old.x)) {
      n.x = old.x; n.y = old.y; n.vx = old.vx; n.vy = old.vy;
      if (Number.isFinite(old.fx)) { n.fx = old.fx; n.fy = old.fy; }
    } else if (n.kind === "directory") {
      // already placed
    } else if (n.parent && Number.isFinite(n.parent.x)) {
      n.x = n.parent.x; n.y = n.parent.y;
    } else if (n.dir && Number.isFinite(n.dir.x)) {
      n.x = n.dir.x; n.y = n.dir.y;
    }
  }

  updateHandoffs(flat, new Map(flat.nodes.map((n) => [n.id, n])));

  const selection = nodeLayer.selectAll("g.node").data(flat.nodes, (d) => d.id);

  const entering = selection.enter()
    .append("g")
    .attr("class", "node")
    .style("opacity", 0)
    .call(drag)
    .on("click", (event, d) => {
      event.stopPropagation();
      selectNode(d);
    });

  entering.append("circle").attr("class", "halo");
  entering.append("circle").attr("class", "ring");

  entering.append("circle").attr("class", "bubble");
  entering.append("text").attr("class", "name").attr("text-anchor", "middle");
  entering.append("text").attr("class", "meta").attr("text-anchor", "middle");
  entering.append("text").attr("class", "tok").attr("text-anchor", "middle");
  entering.append("text").attr("class", "act").attr("text-anchor", "middle");
  entering.append("title");

  entering.transition().duration(320).style("opacity", 1);
  selection.exit().transition().duration(240).style("opacity", 0).remove();

  nodeSel = entering.merge(selection);

  nodeSel.attr("class", (d) => {
    const state = d.kind === "directory" ? "dir" : d.data.state;
    const selected = d.id === view.selected ? " selected" : "";
    const role = view.holders.has(d.id) ? " holder" : view.delegating.has(d.id) ? " delegating" : "";
    const face = d.kind === "directory" ? "" : " has-face";
    return "node kind-" + d.kind + " state-" + state + role + face + selected;
  });

  nodeSel.select("circle.halo").attr("r", (d) => d.r + 5);
  nodeSel.select("circle.ring").attr("r", (d) => d.r + 9);

  nodeSel.select("text.act")
    .attr("y", (d) => nodeGeometry(d).act)
    .attr("font-size", (d) => d.kind === "subagent" ? 9 : 10)
    .text(captionText);

  nodeSel.select("circle.bubble").attr("r", (d) => d.r);

  nodeSel.select("text.name")
    .attr("y", (d) => nodeGeometry(d).name)
    .attr("font-size", (d) => d.kind === "directory" ? 13 : d.kind === "subagent" ? 11 : 12.5)
    .text((d) => labelParts(d)[0]);

  nodeSel.select("text.meta")
    .attr("y", (d) => nodeGeometry(d).meta)
    .attr("font-size", (d) => d.kind === "directory" ? 10.5 : 9.5)
    .text((d) => labelParts(d)[1]);

  nodeSel.select("text.tok")
    .attr("y", (d) => nodeGeometry(d).tok)
    .attr("font-size", 9.5)
    .style("display", (d) => d.kind === "subagent" ? "none" : null)
    .text((d) => labelParts(d)[2]);

  nodeSel.select("title").text(tooltipText);

  syncFaces();

  /* links */
  const linkJoin = linkLayer.selectAll("line.link").data(flat.links, (d) => d.key);
  const linkEnter = linkJoin.enter().append("line").attr("class", "link").style("opacity", 0);
  linkEnter.transition().duration(300).style("opacity", 1);
  linkJoin.exit().transition().duration(240).style("opacity", 0).remove();

  linkSel = linkEnter.merge(linkJoin)
    .attr("class", (d) => "link" + (d.handoff ? " handoff" : d.live ? " live" : ""));

  /* simulation */
  if (!view.sim) {
    view.sim = d3.forceSimulation(flat.nodes)
      .force("link", d3.forceLink(flat.links)
        .id((d) => d.id)
        .distance((l) => l.target.kind === "directory"
          ? 168
          : 64 + l.source.r + l.target.r)
        .strength((l) => l.target.kind === "directory" ? 0.62 : 0.88))
      .force("charge", d3.forceManyBody().strength((d) => d.kind === "directory" ? -1100 : -230))
      // Faces get extra room for the labels underneath them.
      .force("collide", d3.forceCollide().radius((d) => d.kind === "directory" ? d.r + 7 : d.r + 30).iterations(2))
      .force("x", d3.forceX(xTarget).strength(xyStrength))
      .force("y", d3.forceY(yTarget).strength(xyStrength))
      .alphaDecay(0.045)
      .velocityDecay(0.36)
      .on("tick", ticked);
  } else {
    view.sim.nodes(flat.nodes);
    view.sim.force("link").links(flat.links);
    view.sim.force("x", d3.forceX(xTarget).strength(xyStrength));
    view.sim.force("y", d3.forceY(yTarget).strength(xyStrength));

    if (topologyChanged) {
      view.sim.alpha(0.8).restart();
    } else if (radiusChanged) {
      view.sim.alpha(0.06).restart();
    }
  }

  view.nodes = flat.nodes;
  view.links = flat.links;
  view.byId = new Map(flat.nodes.map((n) => [n.id, n]));

  ticked();
  updateChrome(data);
  updateWorkNow();
  updateToday(data);

  if (view.selected && view.byId.has(view.selected)) {
    nodeSel.classed("selected", (d) => d.id === view.selected);
  }

  if (!view.hashHandled) {
    view.hashHandled = true;
    const match = /^#select=(.+)$/.exec(location.hash);
    if (match) {
      const id = decodeURIComponent(match[1]);
      const node = view.byId.get(id) || view.byId.get("dir:" + id);
      if (node) selectNode(node);
    }
  }

  refreshDetail();
}

function ticked() {
  if (nodeSel) {
    nodeSel.attr("transform", (d) => "translate(" + (d.x || 0) + "," + (d.y || 0) + ")");
  }
  if (linkSel) {
    linkSel.each(function (d) {
      const dx = (d.target.x || 0) - (d.source.x || 0);
      const dy = (d.target.y || 0) - (d.source.y || 0);
      const distance = Math.sqrt(dx * dx + dy * dy) || 1;
      const ux = dx / distance;
      const uy = dy / distance;

      d3.select(this)
        .attr("x1", (d.source.x || 0) + ux * (d.source.r + 2))
        .attr("y1", (d.source.y || 0) + uy * (d.source.r + 2))
        .attr("x2", (d.target.x || 0) - ux * (d.target.r + 4))
        .attr("y2", (d.target.y || 0) - uy * (d.target.r + 4));
    });
  }
}

/* -------------------------------------------------------------- chrome --- */

function setLive(mode, text) {
  document.getElementById("liveDot").className = "live-dot " + mode;
  document.getElementById("liveText").textContent = text;
  const badge = document.getElementById("sbMode");
  badge.className = "sb-mode " + mode;
  badge.textContent = mode === "live" ? "LIVE" : mode === "stale" ? "STALE" : "OFFLINE";
}

function updateChrome(data) {
  setLive(data.monitor.stale ? "stale" : "live", data.monitor.stale ? "stale" : "live");

  const server = data.server || {};
  const bits = [];
  if (server.version) bits.push("v" + server.version);
  if (server.url) bits.push(server.url.replace(/^https?:\/\//, ""));
  if (typeof server.latencyMs === "number" && server.healthy) bits.push(server.latencyMs + "ms");
  document.getElementById("serverInfo").textContent = bits.join("  ");

  const totals = data.totals || {};
  const chip = (n, one, many, cls) =>
    '<span class="chip' + (cls ? " " + cls : "") + (n ? "" : " zero") + '"><b>' + n + "</b> " + (n === 1 ? one : many) + "</span>";
  document.getElementById("chips").innerHTML =
    chip(totals.directories || 0, "dir", "dirs") +
    chip(totals.sessions || 0, "session", "sessions") +
    chip(totals.running || 0, "running", "running", "running") +
    chip(totals.waiting || 0, "waiting", "waiting", "waiting") +
    chip(totals.subagents || 0, "subagent", "subagents");

  document.getElementById("stale").classList.toggle("hidden", !data.monitor.stale);
}

function updateToday(data) {
  const today = data.today || {};
  const t = today.tokens || {};
  const total = (Number(t.input) || 0) + (Number(t.output) || 0) + (Number(t.reasoning) || 0);

  document.getElementById("todayValue").textContent = fmtTok(total) + " tok";
  document.getElementById("todaySub").textContent =
    "in " + fmtTok(t.input) + "  out " + fmtTok(t.output) + "  reason " + fmtTok(t.reasoning);
  document.getElementById("todayCache").textContent =
    "cache " + fmtTok(t.cacheRead) + (today.steps ? "  " + today.steps + " steps" : "");
  document.getElementById("todayCost").textContent = fmtMoney(today.cost);
}

/* -------------------------------------------------------------- detail --- */

function dirPath(d) {
  if (d.kind === "directory") return d.dirData.path;
  return d.dir ? d.dir.dirData.path : "";
}

function countTree(session) {
  return 1 + (session.children || []).reduce((sum, child) => sum + countTree(child), 0);
}

const copyIconSvg = '<svg width="11" height="11" viewBox="0 0 11 11" fill="none"><rect x="3.5" y="3.5" width="6.5" height="6.5" rx="1" stroke="currentColor" stroke-width="1.2"/><rect x="1" y="1" width="6.5" height="6.5" rx="1" stroke="currentColor" stroke-width="1.2" fill="var(--bg)"/></svg>';

function sessionRows(d) {
  const s = d.data;
  const sinceDur = s.stateSince ? fmtDur(Date.now() - s.stateSince) : "";

  let html = '<div class="d-kicker">' + (d.kind === "subagent" ? "subagent" : "session") + "</div>";
  html += "<h2>" + esc(s.name) + "</h2>";
  html += '<div class="d-subhead">';
  html += '<span class="st ' + esc(s.state) + '">' + esc(s.state) + "</span>";
  if (s.stateDetail) html += '<span class="d-since">' + esc(s.stateDetail) + "</span>";
  if (sinceDur) html += '<span class="d-since">' + sinceDur + "</span>";
  html += "</div>";

  if ((s.state === "running" || s.state === "waiting") && (s.activityFull || s.activity)) {
    html += '<div class="d-section">doing now</div><div class="d-prompt mono">' +
      esc((s.stateDetail ? s.stateDetail + ": " : "") + (s.activityFull || s.activity)) + "</div>";
  }

  if (s.task) {
    html += '<div class="d-section">assigned task</div><div class="d-prompt">' + esc(s.task) + "</div>";
  }

  const handedOff = Array.from((view.handoffs || new Map()).values()).filter((h) => h.parentId === d.id);
  if (handedOff.length) {
    html += '<div class="d-section">handed off to</div>';
    for (const h of handedOff) {
      const child = view.byId.get(h.childId);
      const childState = child ? child.data.state : "";
      html += '<button class="kid" data-id="' + esc(h.childId) + '">' +
        "<span>" + esc(h.agent) + " · " + esc(h.label) + "</span>" +
        '<span class="st ' + esc(childState) + '">' + esc(childState) + "</span>" +
        "</button>";
    }
  }

  const rows = [
    ["id", '<span class="mono">' + esc(s.id) + '</span><button class="copy-btn" data-copy="' + esc(s.id) + '" title="Copy session ID">' + copyIconSvg + "</button>"],
    ["agent", esc(s.agent || "—")],
    ["model", '<span class="mono">' + esc(s.model || "—") + "</span>"],
    ["dir", '<span class="mono small d-path">' + esc(dirPath(d)) + "</span>"],
    ["created", esc(fmtDate(s.createdAt))],
    s.runningSince ? ["running", esc(fmtDate(s.runningSince)) + " · " + esc(fmtDur(Date.now() - s.runningSince))] : null,
    ["updated", esc(fmtDate(s.updatedAt))],
    ["outcome", esc(s.outcome || "—")],
  ].filter(Boolean);

  html += "<dl>";
  for (const [key, value] of rows) {
    html += "<dt>" + esc(key) + "</dt><dd>" + value + "</dd>";
  }
  html += "</dl>";

  const t = s.tokens || {};
  html += '<div class="d-section">tokens</div><div class="tokgrid">' +
    "<div><b>" + fmtTok(t.total) + "</b><span>total</span></div>" +
    "<div><b>" + fmtTok(t.input) + "</b><span>input</span></div>" +
    "<div><b>" + fmtTok(t.output) + "</b><span>output</span></div>" +
    "<div><b>" + fmtTok(t.reasoning) + "</b><span>reasoning</span></div>" +
    "<div><b>" + fmtTok(t.cacheRead) + "</b><span>cache rd</span></div>" +
    "<div><b>" + fmtMoney(s.cost) + "</b><span>cost</span></div>" +
    "</div>";

  if (s.prompt) {
    html += '<div class="d-section">first prompt</div><div class="d-prompt">' + esc(s.prompt) + "</div>";
  }

  const kids = s.children || [];
  if (kids.length) {
    html += '<div class="d-section">subagents · ' + countTree(s) + " total</div>";
    for (const kid of kids) {
      html += '<button class="kid" data-id="' + esc(kid.id) + '">' +
        "<span>" + esc(kid.name) + "</span>" +
        '<span class="st ' + esc(kid.state) + '">' + esc(kid.state) + "</span>" +
        "</button>";
    }
  }

  return html;
}

function directoryRows(d) {
  const dir = d.dirData;
  let html = '<div class="d-kicker">directory</div>';
  html += "<h2>" + esc(dir.label) + "</h2>";
  html += '<div class="d-subhead">';
  html += '<span class="d-since">' + dir.sessionCount + " session" + (dir.sessionCount !== 1 ? "s" : "") + "</span>";
  if (dir.runningCount) html += '<span class="st running">' + dir.runningCount + " running</span>";
  html += "</div>";

  html += "<dl>";
  html += '<dt>path</dt><dd class="mono small d-path">' + esc(dir.path) + '<button class="copy-btn" data-copy="' + esc(dir.path) + '" title="Copy path">' + copyIconSvg + "</button></dd>";
  html += "<dt>sessions</dt><dd>" + dir.sessionCount + "</dd>";
  html += "<dt>running</dt><dd>" + dir.runningCount + "</dd>";
  html += "<dt>waiting</dt><dd>" + (dir.waitingCount || 0) + "</dd>";
  html += "</dl>";

  if (dir.sessions && dir.sessions.length) {
    html += '<div class="d-section">sessions</div>';
    for (const session of dir.sessions) {
      html += '<button class="kid" data-id="' + esc(session.id) + '">' +
        "<span>" + esc(session.name) + "</span>" +
        '<span class="st ' + esc(session.state) + '">' + esc(session.state) + "</span>" +
        "</button>";
    }
  }

  return html;
}

function selectNode(d) {
  view.selected = d.id;
  if (nodeSel) nodeSel.classed("selected", (n) => n.id === view.selected);

  const body = document.getElementById("detailBody");
  body.innerHTML = d.kind === "directory" ? directoryRows(d) : sessionRows(d);
  attachDetailHandlers(body);

  document.getElementById("detail").classList.add("open");
}

function attachDetailHandlers(body) {
  for (const button of body.querySelectorAll("[data-id]")) {
    button.addEventListener("click", () => {
      const node = view.byId.get(button.getAttribute("data-id"));
      if (node) selectNode(node);
    });
  }

  for (const btn of body.querySelectorAll(".copy-btn")) {
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      navigator.clipboard.writeText(btn.getAttribute("data-copy")).then(() => {
        btn.innerHTML = "✓";
        btn.classList.add("copied");
        setTimeout(() => { btn.innerHTML = copyIconSvg; btn.classList.remove("copied"); }, 1500);
      });
    });
  }
}

function refreshDetail() {
  if (!view.selected) return;

  const panel = document.getElementById("detail");
  if (!panel.classList.contains("open")) return;

  const node = view.byId.get(view.selected);
  if (!node) {
    closeDetail();
    return;
  }

  const body = document.getElementById("detailBody");
  const scrollTop = body.scrollTop;
  body.innerHTML = node.kind === "directory" ? directoryRows(node) : sessionRows(node);
  attachDetailHandlers(body);
  body.scrollTop = scrollTop;
}

function closeDetail() {
  view.selected = null;
  if (nodeSel) nodeSel.classed("selected", false);
  document.getElementById("detail").classList.remove("open");
}

document.getElementById("detailClose").addEventListener("click", closeDetail);
addEventListener("keydown", (event) => {
  if (event.key === "Escape") closeDetail();
});

/* ---------------------------------------------------------------- zoom --- */

function fitView(animate) {
  if (!view.nodes.length) return;

  const xs = [];
  const ys = [];
  for (const n of view.nodes) {
    if (!Number.isFinite(n.x) || !Number.isFinite(n.y)) continue;
    xs.push(n.x - n.r, n.x + n.r);
    ys.push(n.y - n.r, n.y + n.r);
  }
  if (!xs.length) return;

  const minX = Math.min.apply(null, xs);
  const maxX = Math.max.apply(null, xs);
  const minY = Math.min.apply(null, ys);
  const maxY = Math.max.apply(null, ys);

  const pad = 30;
  const panelOpen = document.getElementById("detail").classList.contains("open");
  const availW = Math.max(120, W - pad * 2 - (panelOpen ? 370 : 0));
  const availH = Math.max(120, H - 170);

  const scale = clamp(
    Math.min(availW / Math.max(1, maxX - minX), availH / Math.max(1, maxY - minY), 1.7),
    0.18,
    1.7
  );

  const cx = (minX + maxX) / 2;
  const cy = (minY + maxY) / 2 + 22;
  const viewCx = panelOpen ? (W - 370) / 2 : W / 2;
  const transform = d3.zoomIdentity
    .translate(viewCx - scale * cx, H / 2 - scale * cy)
    .scale(scale);

  if (animate === false) {
    SVG.call(zoom.transform, transform);
  } else {
    SVG.transition().duration(600).call(zoom.transform, transform);
  }
}

addEventListener("resize", () => {
  W = innerWidth;
  H = innerHeight;

  if (!view.nodes.length) return;
  placeDirectories(view.nodes);

  if (view.sim) {
    view.sim.force("x", d3.forceX(xTarget).strength(xyStrength));
    view.sim.force("y", d3.forceY(yTarget).strength(xyStrength));
    view.sim.alpha(0.25).restart();
  }
});

/* ---------------------------------------------------------------- poll --- */

function markOffline() {
  setLive("offline", "monitor offline");
  document.getElementById("stale").classList.remove("hidden");
}

async function poll() {
  let delay = 1000;

  try {
    const res = await fetch("/sessions.json?t=" + Date.now(), { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    render(data);
  } catch (err) {
    markOffline();
    delay = 1500;
  }

  setTimeout(poll, delay);
}

poll();
</script>
